<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projekt-Zeitstrahl</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js?v=8" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="project-editor">
        <p class="eyebrow">Projektplanung</p>
        <label class="sr-only" for="projectTitleInput">Titel des Zeitstrahls</label>
        <input id="projectTitleInput" class="project-title-input" maxlength="80" value="Projekt-Zeitstrahl">
        <label class="sr-only" for="projectDescriptionInput">Beschreibung des Zeitstrahls</label>
        <textarea id="projectDescriptionInput" class="project-description-input" rows="2" maxlength="400" placeholder="Beschreibung des Projekts"></textarea>
      </div>
      <div class="header-actions">
        <button class="secondary-button" id="lockButton" type="button">Bearbeiten entsperren</button>
        <button class="secondary-button" id="toggleEditorButton" type="button" aria-expanded="true">Editor ausblenden</button>
        <button class="primary-button" id="newCardButton" type="button">
          <span aria-hidden="true">+</span>
          Neue Karte
        </button>
      </div>
    </header>

    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="formTitle">
        <div class="panel-heading">
          <h2 id="formTitle">Karte bearbeiten</h2>
          <button class="ghost-button" id="cancelEditButton" type="button">Zuruecksetzen</button>
        </div>

        <form id="cardForm" autocomplete="off">
          <input id="cardId" type="hidden">

          <label for="titleInput">Ueberschrift</label>
          <input id="titleInput" name="title" maxlength="60" required placeholder="Meilenstein, Entscheidung oder Aufgabe">
          <div class="field-meta"><span id="titleCount">0</span>/60 Zeichen</div>

          <label for="dateInput">Datum</label>
          <div class="date-control">
            <input id="dateInput" name="date" type="text" inputmode="numeric" required placeholder="TT.MM.JJJJ">
            <input id="nativeDateInput" class="native-date-input" type="date" tabindex="-1" aria-hidden="true">
            <button class="date-picker-button" id="datePickerButton" type="button" aria-label="Datum auswaehlen" title="Datum auswaehlen">
              <span aria-hidden="true">&#128197;</span>
            </button>
          </div>

          <label for="descriptionInput">Text</label>
          <textarea id="descriptionInput" name="description" maxlength="500" rows="7" required placeholder="Was passiert in diesem Projektschritt?"></textarea>
          <div class="field-meta"><span id="descriptionCount">0</span>/500 Zeichen</div>

          <fieldset>
            <legend>Hintergrundfarbe</legend>
            <div class="color-grid" id="colorGrid"></div>
          </fieldset>

          <div class="form-actions">
            <button class="primary-button" type="submit">Speichern</button>
            <button class="secondary-button" id="deleteCurrentButton" type="button">Loeschen</button>
          </div>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="timeline-panel" aria-labelledby="timelineTitle">
        <div class="timeline-toolbar">
          <div>
            <h2 id="timelineTitle">Zeitstrahl</h2>
            <p id="cardSummary">Noch keine Karten gespeichert.</p>
          </div>
          <button class="secondary-button" id="exportAllButton" type="button">Alle als PDF</button>
        </div>

        <div class="timeline" id="timeline" aria-live="polite"></div>
      </section>
    </main>

    <dialog class="password-dialog" id="passwordDialog">
      <form id="passwordForm" method="dialog">
        <h2 id="passwordTitle">Bearbeitung entsperren</h2>
        <p id="passwordHelp">Gib das Kennwort ein, um das Board zu bearbeiten.</p>
        <label for="passwordInput">Kennwort</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required>
        <label class="password-confirm-field" for="passwordConfirmInput">Kennwort wiederholen</label>
        <input class="password-confirm-field" id="passwordConfirmInput" type="password" autocomplete="new-password">
        <p class="form-status" id="passwordStatus" role="status" aria-live="polite"></p>
        <div class="dialog-actions">
          <button class="ghost-button" id="cancelPasswordButton" type="button">Abbrechen</button>
          <button class="primary-button" type="submit">Entsperren</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
